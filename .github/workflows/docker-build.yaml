# Reusable multi-arch Docker build & publish workflow.
#
# Pipeline shape: prepare -> build (matrix, one job per platform) -> merge.
# Each platform builds on its native GitHub-hosted runner (amd64 on
# ubuntu-24.04, arm64 on ubuntu-24.04-arm) in parallel.
#
# On the push path each build job: builds the default stage with load (when
# startupTest is true), runs a startup test against the loaded image
# (default on, opt-out with startupTest: false), then pushes by digest only
# (no tags); the merge job assembles a multi-arch manifest list over those
# digests and applies the final tag set. No-push path (PRs, explicit
# push=false): builds and tests run for validation only and merge is skipped
# entirely.

name: Build & Publish Image

on:
  workflow_call:
    inputs:
      imageName:
        description: "Base name of the image (e.g., myorg/myimage)"
        type: string
        required: true
      tagName:
        description: "Optional explicit tag to use (overrides auto-detection)"
        type: string
        required: false
      dockerfilePath:
        description: "Path to your project's Dockerfile"
        required: false
        default: ./Dockerfile
        type: string
      additionalTarget:
        description: "An additional Docker build target stage to build and push"
        required: false
        type: string
      push:
        description: "Use to override default push behavior. If false, will not push, even from a release."
        type: string
        required: false
      versionMode:
        description: "How to inject version at build time: none | npm | csproj"
        type: string
        required: false
        default: "none"
      versionFiles:
        description: "Newline-separated file paths to update (used by npm mode to set version in package.json files before build)"
        type: string
        required: false
      buildArgs:
        description: "Optional docker build args (newline-separated: key=value)"
        type: string
        required: false
      platforms:
        description: "Comma-separated list of target platforms (e.g., linux/amd64,linux/arm64)"
        type: string
        required: false
        default: "linux/amd64,linux/arm64"
      preBuildCommands:
        description: "Optional shell commands to run before docker build (e.g. fetch artifacts). Runs as caller-supplied shell with the calling workflow's trust."
        type: string
        required: false
      startupTest:
        description: "Run a startup test after building the default stage"
        type: boolean
        required: false
        default: true
      startupTestPath:
        description: "Health endpoint path to check (must start with /). Empty means try the default list."
        type: string
        required: false
        default: ""
      startupTestEnv:
        description: "Additional environment variables for the startup test (newline-separated KEY=VALUE, applied after defaults; blank lines and lines starting with # are skipped)"
        type: string
        required: false
        default: ""

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      push: ${{ steps.push_condition.outputs.push }}
      needs_merge: ${{ steps.push_condition.outputs.needs_merge }}
      has_additional_target: ${{ steps.flags.outputs.has_additional_target }}
      image_slug: ${{ steps.image_slug.outputs.image_slug }}
    steps:
      - name: Determine push condition
        id: push_condition
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Workflow triggered by pull_request. Will not push."
            PUSH=false
          else
            if [[ -n "$INPUT_PUSH" ]]; then
              echo "Push override input detected: '$INPUT_PUSH'."
              PUSH="$INPUT_PUSH"
            else
              echo "No push override. Will push by default."
              PUSH=true
            fi
          fi

          if [[ "$PUSH" == "true" ]]; then
            NEEDS_MERGE=true
          else
            NEEDS_MERGE=false
          fi

          echo "Final push decision: $PUSH"
          echo "Final needs_merge: $NEEDS_MERGE"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "needs_merge=$NEEDS_MERGE" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}

      - name: Compute flags
        id: flags
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_ADDITIONAL_TARGET" ]]; then
            echo "has_additional_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_additional_target=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUT_ADDITIONAL_TARGET: ${{ inputs.additionalTarget }}

      # Slug of the image name, used to key the buildx cache so multiple
      # images built from one repo do not overwrite each other's cache.
      - name: Compute image slug
        id: image_slug
        run: |
          set -euo pipefail
          echo "image_slug=$(printf '%s' "$IMAGE_NAME" | tr '/:' '--')" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ inputs.imageName }}

      # Emits a JSON matrix mapping each requested platform to its native
      # runner label. Centralizing the mapping here is the only place to
      # update if GitHub renames a runner label.
      - name: Build matrix from platforms input
        id: matrix
        run: |
          set -euo pipefail

          declare -A RUNNER_FOR
          RUNNER_FOR["linux/amd64"]="ubuntu-24.04"
          RUNNER_FOR["linux/arm64"]="ubuntu-24.04-arm"

          IFS=',' read -r -a PLATFORMS <<< "$INPUT_PLATFORMS"

          ENTRIES="[]"
          for raw in "${PLATFORMS[@]}"; do
            p="${raw//[[:space:]]/}"
            [[ -z "$p" ]] && continue
            if [[ -z "${RUNNER_FOR[$p]:-}" ]]; then
              echo "::error::Unsupported platform '$p'. Supported: ${!RUNNER_FOR[*]}"
              exit 1
            fi
            runner="${RUNNER_FOR[$p]}"
            safe="$(echo "$p" | tr '/' '-')"
            ENTRIES="$(jq -c --arg p "$p" --arg r "$runner" --arg s "$safe" \
              '. + [{platform:$p, runner:$r, safe:$s}]' <<< "$ENTRIES")"
          done

          if [[ "$ENTRIES" == "[]" ]]; then
            echo "::error::No valid platforms derived from input '$INPUT_PLATFORMS'"
            exit 1
          fi

          MATRIX="$(jq -c --argjson include "$ENTRIES" -n '{include:$include}')"
          echo "Derived matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}

  # One matrix job per platform, each on its native runner. fail-fast is
  # disabled so a flake on one arch doesn't cancel the other -- the merge
  # job still requires all platforms to succeed before running.
  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # preBuildCommands is caller-supplied shell by design; it runs with the same trust as the calling workflow.
      - name: Pre-build commands
        if: inputs.preBuildCommands != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Running pre-build commands on $PLATFORM..."
          bash -euo pipefail -c "$PRE_BUILD_COMMANDS"
        env:
          PLATFORM: ${{ matrix.platform }}
          PRE_BUILD_COMMANDS: ${{ inputs.preBuildCommands }}

      - name: Determine version from tag
        id: version
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG_NAME" ]]; then
            TAG="$INPUT_TAG_NAME"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi

          if [[ -z "$TAG" ]]; then
            echo "No tag found; skipping version handling."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG_NAME: ${{ inputs.tagName }}

      - name: Inject version into package.json files (npm)
        if: inputs.versionMode == 'npm' && steps.version.outputs.version != '' && inputs.versionFiles != ''
        run: |
          set -euo pipefail
          echo "Setting npm version to: $VERSION"
          mapfile -t FILES <<< "$INPUT_VERSION_FILES"
          for f in "${FILES[@]}"; do
            [[ -z "$f" ]] && continue
            if [[ ! -f "$f" ]]; then
              echo "::error::Version file not found: $f"
              exit 1
            fi
            dir=$(dirname "$f")
            pushd "$dir" > /dev/null
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            popd > /dev/null
            echo "Updated $f to version $VERSION"
          done
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INPUT_VERSION_FILES: ${{ inputs.versionFiles }}

      - name: Prepare build args for .NET version (csproj)
        id: version_build_args
        if: inputs.versionMode == 'csproj' && steps.version.outputs.version != ''
        run: |
          set -euo pipefail
          echo "Injecting .NET version as build args: $VERSION"
          {
            echo "args<<EOF"
            echo "VERSION=$VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Combine build args
        id: combined_build_args
        run: |
          set -euo pipefail
          {
            echo "args<<EOF"
            if [[ -n "$USER_ARGS" ]]; then
              echo "$USER_ARGS"
            fi
            if [[ -n "$VERSION_ARGS" ]]; then
              echo "$VERSION_ARGS"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          USER_ARGS: ${{ inputs.buildArgs }}
          VERSION_ARGS: ${{ steps.version_build_args.outputs.args }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # OCI labels (org.opencontainers.image.*) must be baked into the
      # image config at build time -- `imagetools create` in the merge
      # job writes manifest lists and cannot add config-level labels
      # after the fact. Tag rules are intentionally empty here; the
      # merge job owns tag generation. We only need the `labels` output.
      - name: Docker Meta (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.imageName }}
          tags: |

      - name: Build default stage for startup test
        id: build_startup_test
        if: inputs.startupTest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfilePath }}
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          push: false
          tags: startup-test:local
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.combined_build_args.outputs.args }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-default
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-default

      - name: Startup test default stage
        id: startup_test
        if: inputs.startupTest
        shell: bash
        run: |
          set -euo pipefail

          # Validate STARTUP_TEST_PATH
          if [[ -n "$STARTUP_TEST_PATH" ]]; then
            if [[ ! "$STARTUP_TEST_PATH" =~ ^/ ]]; then
              echo "::error title=Startup test failed::STARTUP_TEST_PATH must start with /"
              exit 1
            fi
            if [[ "$STARTUP_TEST_PATH" =~ [[:space:]]|[[:cntrl:]] ]]; then
              echo "::error title=Startup test failed::STARTUP_TEST_PATH contains invalid characters"
              exit 1
            fi
          fi

          # Write the env file: defaults first, then the validated caller env
          # (CR stripped, blank and comment lines skipped), so caller values
          # override.
          env_file="$RUNNER_TEMP/startup-test.env"
          {
            echo "Database__Provider=PostgreSQL"
            echo "ConnectionStrings__PostgreSQL=Server=localhost;Port=5432;Database=startuptest;Username=postgres;Password=startuptest"
            echo "Database__ConnectionString=Server=localhost;Port=5432;Database=startuptest;Username=postgres;Password=startuptest"
            echo "Oidc__RequireHttpsMetadata=false"
            echo "GameEngine__ClientId=startuptest"
            echo "GameEngine__ClientSecret=startuptest"
          } > "$env_file"
          if [[ -n "$STARTUP_TEST_ENV" ]]; then
            line_num=0
            while IFS= read -r line; do
              line_num=$((line_num + 1))
              # Like docker --env-file: strip CR and leading whitespace, then
              # skip blank and comment lines
              line="${line%$'\r'}"
              line="${line#"${line%%[![:space:]]*}"}"
              [[ -z "$line" ]] && continue
              [[ "$line" == \#* ]] && continue
              if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_.]*= ]]; then
                echo "::error title=Startup test failed::Invalid env line $line_num"
                exit 1
              fi
              echo "$line" >> "$env_file"
            done <<< "$STARTUP_TEST_ENV"
          fi

          # Cleanup on exit
          cleanup() {
            docker rm -f startup-test-app startup-test-postgres >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Detect port from ExposedPorts
          inspect_err="$RUNNER_TEMP/startup-test-inspect.err"
          if ! exposed="$(docker image inspect -f '{{json .Config.ExposedPorts}}' "$IMAGE" 2>"$inspect_err")"; then
            cat "$inspect_err" >&2 || true
            echo "::error title=Startup test failed::Failed to inspect image"
            exit 1
          fi
          port=8080
          if [[ "$exposed" != "null" ]]; then
            tcp_ports="$(echo "$exposed" | jq -r 'keys[] | select(endswith("/tcp"))' | sed 's|/tcp||' || true)"
            if [[ -n "$tcp_ports" ]]; then
              port="$(echo "$tcp_ports" | sort -n | head -n1)"
            fi
          fi

          # Determine paths to check
          if [[ -n "$STARTUP_TEST_PATH" ]]; then
            paths=("$STARTUP_TEST_PATH")
          else
            paths=("/api/health/ready" "/api/health/version" "/api/status" "/")
          fi

          echo "Startup test: image $IMAGE, port $port, paths ${paths[*]}"

          # Pull Postgres image (docker's stderr stays visible in the log)
          if ! docker pull -q "$PG_IMAGE"; then
            echo "::error title=Startup test failed::Failed to pull Postgres image"
            exit 1
          fi

          # Start Postgres
          if ! docker run -d --name startup-test-postgres \
            -p "127.0.0.1:${port}:${port}" \
            -e POSTGRES_PASSWORD=startuptest \
            -e POSTGRES_DB=startuptest \
            "$PG_IMAGE" >/dev/null; then
            echo "::error title=Startup test failed::Failed to start Postgres container"
            exit 1
          fi

          # Wait for Postgres to be ready
          pg_ready=false
          for _ in {1..60}; do
            if docker exec startup-test-postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              pg_ready=true
              break
            fi
            sleep 1
          done

          if [[ "$pg_ready" != "true" ]]; then
            echo "::group::Container logs"
            docker logs --tail 200 startup-test-postgres || true
            echo "::endgroup::"
            echo "::error title=Startup test failed::Postgres failed to become ready"
            exit 1
          fi

          # Start the app
          if ! docker run -d --name startup-test-app \
            --network "container:startup-test-postgres" \
            --env-file "$env_file" \
            "$IMAGE" >/dev/null; then
            echo "::group::Container logs"
            docker logs --tail 200 startup-test-app 2>/dev/null || true
            echo "::endgroup::"
            echo "::error title=Startup test failed::Failed to start container"
            exit 1
          fi

          # Poll for health. With the default list, the first path that
          # answers 5xx (a health endpoint reporting unhealthy) is locked:
          # later rounds poll only that path, and success needs a 200 from it.
          # Any other non-200 answer (404, 401, 3xx, no response) moves on.
          max_rounds=$((STARTUP_TEST_TIMEOUT_SECONDS / STARTUP_TEST_POLL_SECONDS))
          healthy=false
          declare -A last_code
          locked_path=""
          deadline=$((SECONDS + STARTUP_TEST_TIMEOUT_SECONDS))

          for ((round=1; round<=max_rounds; round++)); do
            # Check if container is still running
            state="$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' startup-test-app 2>/dev/null || echo "unknown 0")"
            status="${state%% *}"
            if [[ "$status" != "running" ]]; then
              exit_code="${state##* }"
              echo "::group::Container logs"
              docker logs --tail 200 startup-test-app || true
              echo "::endgroup::"
              echo "::error title=Startup test failed::Container $status with exit code $exit_code"
              exit 1
            fi

            # Try each path (only the locked one once a path is locked)
            if [[ -n "$locked_path" ]]; then
              round_paths=("$locked_path")
            else
              round_paths=("${paths[@]}")
            fi
            for path in "${round_paths[@]}"; do
              # Never start a request at or past the deadline, and never let
              # one run past it
              remaining=$((deadline - SECONDS))
              if [[ "$remaining" -le 0 ]]; then
                break 2
              fi
              max_time=$((remaining < 5 ? remaining : 5))
              code="$(curl --globoff -s -o /dev/null -w '%{http_code}' --max-time "$max_time" "http://127.0.0.1:${port}${path}" 2>/dev/null || true)"
              code="${code:-000}"
              # A response that arrives at or after the deadline does not count
              if [[ "$SECONDS" -ge "$deadline" ]]; then
                break 2
              fi
              last_code["$path"]="$code"
              if [[ "$code" == "200" ]]; then
                healthy=true
                success_path="$path"
                break 2
              fi
              if [[ -z "$STARTUP_TEST_PATH" && -z "$locked_path" && "$code" == 5?? ]]; then
                locked_path="$path"
                echo "Startup test: using $path (answered $code)"
                break
              fi
            done

            # Check wall-clock deadline
            if [[ "$SECONDS" -ge "$deadline" ]]; then
              break
            fi

            sleep "$STARTUP_TEST_POLL_SECONDS"
          done

          if [[ "$healthy" != "true" ]]; then
            echo "::group::Container logs"
            docker logs --tail 200 startup-test-app || true
            echo "::endgroup::"
            status_msg=""
            if [[ -n "$locked_path" ]]; then
              report_paths=("$locked_path")
            else
              report_paths=("${paths[@]}")
            fi
            for path in "${report_paths[@]}"; do
              code="${last_code[$path]:-000}"
              status_msg="${status_msg:+$status_msg }${path}=${code}"
            done
            echo "::error title=Startup test failed::Timeout waiting for healthy response (last status: $status_msg)"
            exit 1
          fi

          echo "Startup test passed: $success_path returned 200 on port $port"
        env:
          IMAGE: startup-test:local
          STARTUP_TEST_PATH: ${{ inputs.startupTestPath }}
          STARTUP_TEST_ENV: ${{ inputs.startupTestEnv }}
          STARTUP_TEST_TIMEOUT_SECONDS: '120'
          STARTUP_TEST_POLL_SECONDS: '2'
          PG_IMAGE: postgres:17.6

      # Push-by-digest: upload the image content but do not apply any
      # tags yet. The merge job collects digests from every platform
      # and creates the final multi-arch tagged manifest list.
      - name: Build (push by digest) default stage
        id: build_default_push
        if: needs.prepare.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfilePath }}
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          outputs: type=image,name=${{ inputs.imageName }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.combined_build_args.outputs.args }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-default
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-default

      - name: Build (no push) default stage
        if: needs.prepare.outputs.push != 'true' && !inputs.startupTest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfilePath }}
          platforms: ${{ matrix.platform }}
          pull: true
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.combined_build_args.outputs.args }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-default
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-default

      # Write the digest as an empty file whose *name* is the sha256.
      # The merge job doesn't need the contents -- just the list of
      # digests, which it recovers from the filenames after download.
      - name: Export default digest
        if: needs.prepare.outputs.push == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/default
          digest="$DIGEST"
          if [[ -z "$digest" ]]; then
            echo "::error::No digest produced for default stage on $PLATFORM"
            exit 1
          fi
          touch "/tmp/digests/default/${digest#sha256:}"
        env:
          DIGEST: ${{ steps.build_default_push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}

      # Per-platform artifact name (digests-default-linux-amd64, etc.)
      # so the merge job can download all platforms' digests together
      # via the `digests-default-*` pattern.
      - name: Upload default digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-default-${{ matrix.safe }}
          path: /tmp/digests/default/*
          if-no-files-found: error
          retention-days: 1

      - name: Build (push by digest) additional target
        id: build_additional_push
        if: needs.prepare.outputs.push == 'true' && needs.prepare.outputs.has_additional_target == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfilePath }}
          target: ${{ inputs.additionalTarget }}
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          outputs: type=image,name=${{ inputs.imageName }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.combined_build_args.outputs.args }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-additional
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-additional

      - name: Build (no push) additional target
        if: needs.prepare.outputs.push != 'true' && needs.prepare.outputs.has_additional_target == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfilePath }}
          target: ${{ inputs.additionalTarget }}
          platforms: ${{ matrix.platform }}
          pull: true
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.combined_build_args.outputs.args }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-additional
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image_slug }}-${{ matrix.safe }}-additional

      - name: Export additional digest
        if: needs.prepare.outputs.push == 'true' && needs.prepare.outputs.has_additional_target == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/additional
          digest="$DIGEST"
          if [[ -z "$digest" ]]; then
            echo "::error::No digest produced for additional target on $PLATFORM"
            exit 1
          fi
          touch "/tmp/digests/additional/${digest#sha256:}"
        env:
          DIGEST: ${{ steps.build_additional_push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}

      - name: Upload additional digest
        if: needs.prepare.outputs.push == 'true' && needs.prepare.outputs.has_additional_target == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-additional-${{ matrix.safe }}
          path: /tmp/digests/additional/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the final multi-arch manifest list from the per-platform
  # digests pushed by the build matrix, then applies the generated tag
  # set. Skipped entirely when not pushing (PRs, push=false).
  merge:
    name: Merge manifests
    needs: [prepare, build]
    if: needs.prepare.outputs.needs_merge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download default digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests/default
          pattern: digests-default-*
          merge-multiple: true

      - name: Download additional digests
        if: needs.prepare.outputs.has_additional_target == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests/additional
          pattern: digests-additional-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Source of truth for tag generation. The `build` job also runs
      # metadata-action but only consumes the `labels` output; all tag
      # rules live here so there's one place to change them.
      - name: Docker Meta for primary image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.imageName }}
          tags: |
            type=raw,value=${{ inputs.tagName }},enable=${{ inputs.tagName != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch,enable=${{ inputs.tagName == '' && !startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=false

      # Derive the additional-target tag set from the primary tags by
      # appending `-<additionalTarget>` to each tag (e.g. `1.2.3` ->
      # `1.2.3-migrations`). Newline-separated to match the primary
      # tags output format.
      - name: Generate additional target tags
        if: needs.prepare.outputs.has_additional_target == 'true'
        id: target_tags
        env:
          ADDITIONAL_TARGET: ${{ inputs.additionalTarget }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          TARGET_TAGS=""
          mapfile -t TAG_ARRAY <<< "$META_TAGS"

          for full_tag in "${TAG_ARRAY[@]}"; do
            tag_part="${full_tag##*:}"
            image_name="${full_tag%%:*}"
            [[ -z "$tag_part" ]] && continue
            new_tag="${image_name}:${tag_part}-${ADDITIONAL_TARGET}"
            if [[ -n "$TARGET_TAGS" ]]; then
              TARGET_TAGS="${TARGET_TAGS}"$'\n'
            fi
            TARGET_TAGS="${TARGET_TAGS}${new_tag}"
          done

          {
            echo "tags<<EOF"
            echo "${TARGET_TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # `imagetools create` assembles a manifest list referencing each
      # per-platform digest that the build matrix pushed, then tags the
      # result. The filenames in /tmp/digests/default are bare sha256
      # hashes (see build job's Export step).
      - name: Create primary manifest list
        working-directory: /tmp/digests/default
        env:
          IMAGE_NAME: ${{ inputs.imageName }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          TAG_ARGS=()
          while IFS= read -r t; do
            [[ -z "$t" ]] && continue
            TAG_ARGS+=("-t" "$t")
          done <<< "$META_TAGS"

          SRC_ARGS=()
          for f in *; do
            [[ -e "$f" ]] || continue
            SRC_ARGS+=("${IMAGE_NAME}@sha256:${f}")
          done

          if [[ ${#SRC_ARGS[@]} -eq 0 ]]; then
            echo "::error::No digests found in /tmp/digests/default"
            exit 1
          fi

          docker buildx imagetools create "${TAG_ARGS[@]}" "${SRC_ARGS[@]}"

      - name: Inspect primary manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          FIRST_TAG="$(head -n1 <<< "$TAGS")"
          docker buildx imagetools inspect "$FIRST_TAG"

      - name: Create additional target manifest list
        if: needs.prepare.outputs.has_additional_target == 'true'
        working-directory: /tmp/digests/additional
        env:
          IMAGE_NAME: ${{ inputs.imageName }}
          TARGET_TAGS: ${{ steps.target_tags.outputs.tags }}
        run: |
          set -euo pipefail
          TAG_ARGS=()
          while IFS= read -r t; do
            [[ -z "$t" ]] && continue
            TAG_ARGS+=("-t" "$t")
          done <<< "$TARGET_TAGS"

          SRC_ARGS=()
          for f in *; do
            [[ -e "$f" ]] || continue
            SRC_ARGS+=("${IMAGE_NAME}@sha256:${f}")
          done

          if [[ ${#SRC_ARGS[@]} -eq 0 ]]; then
            echo "::error::No digests found in /tmp/digests/additional"
            exit 1
          fi

          docker buildx imagetools create "${TAG_ARGS[@]}" "${SRC_ARGS[@]}"

      - name: Inspect additional manifest
        if: needs.prepare.outputs.has_additional_target == 'true'
        env:
          TAGS: ${{ steps.target_tags.outputs.tags }}
        run: |
          set -euo pipefail
          FIRST_TAG="$(head -n1 <<< "$TAGS")"
          docker buildx imagetools inspect "$FIRST_TAG"
