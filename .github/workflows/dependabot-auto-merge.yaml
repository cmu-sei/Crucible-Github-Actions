# Reusable workflow: approve and queue auto-merge for Dependabot updates.
#
# Only acts on pull requests authored by `dependabot[bot]` in cmu-sei
# repositories (forks and other authors are skipped). Updates whose type, as
# classified by Dependabot's own update-type metadata, is within the
# `update-types` input are approved and queued for auto-merge; the rest are
# left for a human to review:
#   * patch (default): semver-patch only.
#   * minor: semver-patch and semver-minor.
#   * all: semver-patch, semver-minor and semver-major.
# An update with no semver update type is always left for review. For a
# grouped pull request the update type is the group's largest bump, so with the
# default a group that contains any minor update is left for review.
#
# The workflow never checks out code, so nothing from the pull request is
# executed; it only reads Dependabot's metadata and calls the GitHub API.
#
# Token (`token` input):
#   * github-token (default): the caller's GITHUB_TOKEN. The calling job grants
#     `contents: write` and `pull-requests: write`, and the repository allows
#     GitHub Actions to approve pull requests. Merges made with GITHUB_TOKEN do
#     not trigger `push` workflows.
#   * app: a token minted from the org's `crucible-ci` GitHub App, narrowed to
#     contents and pull requests. Merges made under the App do trigger `push`
#     workflows (this repository uses it so Auto release runs). Needs the App
#     installed on the repository and CRUCIBLE_HELM_UPDATE_CLIENT_ID /
#     CRUCIBLE_HELM_UPDATE_PRIVATE_KEY passed in; Dependabot-triggered runs
#     receive Dependabot secrets, not Actions secrets.
#
# Depends on these repository settings, configured in this order:
# 1. Required status checks on `main`, so auto-merge waits for CI to pass.
# 2. "Allow auto-merge" enabled.
# If auto-merge is disabled the merge step fails on purpose so the
# misconfiguration is visible. If auto-merge is enabled but no required checks
# are configured, the approval satisfies the review rule and the merge can
# proceed immediately, before CI finishes; hence the order above.

name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      token:
        description: "github-token (the caller's GITHUB_TOKEN; grant contents: write and pull-requests: write) or app (crucible-ci App token; pass the App secrets)."
        type: string
        default: github-token
      merge-method:
        description: "squash, merge or rebase."
        type: string
        default: squash
      update-types:
        description: "Largest update type to approve and merge: patch, minor (patch and minor) or all (patch, minor and major)."
        type: string
        default: patch
    secrets:
      CRUCIBLE_HELM_UPDATE_CLIENT_ID:
        description: "crucible-ci App client ID (token: app)."
        required: false
      CRUCIBLE_HELM_UPDATE_PRIVATE_KEY:
        description: "crucible-ci App private key (token: app)."
        required: false

# No permissions block here on purpose: a called workflow that declares more
# than its caller grants fails at startup, so the job inherits the caller's
# grant instead. Callers grant `contents: write` and `pull-requests: write`
# with token github-token, or read access with token app.

jobs:
  automerge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository_owner == 'cmu-sei'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate inputs
        id: validate
        env:
          TOKEN: ${{ inputs.token }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          UPDATE_TYPES: ${{ inputs.update-types }}
        # Error messages never echo the raw input (a newline in it could
        # inject workflow commands).
        run: |
          set -euo pipefail
          [[ "$TOKEN" =~ ^(github-token|app)$ ]] || { echo "::error::token must be github-token or app"; exit 1; }
          [[ "$MERGE_METHOD" =~ ^(squash|merge|rebase)$ ]] || { echo "::error::merge-method must be squash, merge or rebase"; exit 1; }
          [[ "$UPDATE_TYPES" =~ ^(patch|minor|all)$ ]] || { echo "::error::update-types must be patch, minor or all"; exit 1; }
          {
            echo "token=$TOKEN"
            echo "merge_method=$MERGE_METHOD"
            echo "update_types=$UPDATE_TYPES"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide whether to merge
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          UPDATE_TYPES: ${{ steps.validate.outputs.update_types }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPES:$UPDATE_TYPE" in
            patch:version-update:semver-patch | \
            minor:version-update:semver-patch | minor:version-update:semver-minor | \
            all:version-update:semver-patch | all:version-update:semver-minor | all:version-update:semver-major)
              echo "merge=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "merge=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Leaving ${UPDATE_TYPE:-untyped} update for human review (update-types: $UPDATE_TYPES)."
              ;;
          esac

      - name: Check App credentials
        if: steps.decide.outputs.merge == 'true' && steps.validate.outputs.token == 'app'
        env:
          CLIENT_ID: ${{ secrets.CRUCIBLE_HELM_UPDATE_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.CRUCIBLE_HELM_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            exit 0
          fi
          echo "::error::App credentials not available — pass CRUCIBLE_HELM_UPDATE_CLIENT_ID/PRIVATE_KEY (Dependabot secrets scoped to this repository)"
          exit 1

      - name: Mint crucible-ci App token
        id: app-token
        if: steps.decide.outputs.merge == 'true' && steps.validate.outputs.token == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CRUCIBLE_HELM_UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.CRUCIBLE_HELM_UPDATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Narrow the token to what approve + auto-merge need (least privilege).
          permission-contents: write
          permission-pull-requests: write

      - name: Approve and enable auto-merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          MERGE_METHOD: ${{ steps.validate.outputs.merge_method }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL" --body "Auto-approved: Dependabot $UPDATE_TYPE update ($DEPS)."
          gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"
