# Reusable build-and-test workflow for Crucible API repositories (xUnit v3
# test projects on the shared PostgreSQL test harness).
#
# Pipeline shape (single job): validate -> checkout -> setup .NET -> detect
# test runner -> restore -> build -> test -> confirm PostgreSQL -> upload TRX.
#
# The test runner comes from the repository's own global.json, so CI and a
# local `dotnet test` always agree and there is no second copy of the choice:
#   * no `test.runner` (the default) or "VSTest": `dotnet test` through the
#     VSTest bridge.
#   * "Microsoft.Testing.Platform": the test project runs as its own
#     Microsoft.Testing.Platform app. xunit.v3 4 and later only run this way
#     on the .NET 10 SDK.
# Both write the same TRX file to <test-project>/TestResults/test-results.trx
# and print the harness's database-provider banner to the log.

name: .NET Build and Test

on:
  workflow_call:
    inputs:
      test-project:
        description: "Test project directory, relative to the repository root, e.g. Example.Api.Tests or src/Example.Api.Tests"
        type: string
        required: true
      test-assembly:
        description: "Test assembly name the PostgreSQL banner names (defaults to the test-project directory name)."
        type: string
        default: ""
      expect-postgres:
        description: "Fail unless the log shows the suite ran against PostgreSQL (the shared harness's banner)."
        type: boolean
        default: true
      dotnet-version:
        description: "SDK to install when the repo has no global.json (e.g. 10.0.x). Leave empty to use global.json."
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout in minutes."
        type: number
        default: 30

# No permissions block here on purpose: a called workflow that declares more
# than its caller grants fails at startup, so jobs inherit the caller's grant
# instead. Callers grant `contents: read`.

# A newer run for the same pull request or branch supersedes one still in flight.
concurrency:
  group: dotnet-test-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Validate inputs
        id: validate
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
          TEST_ASSEMBLY: ${{ inputs.test-assembly }}
        # Error messages never echo the raw input (a newline in it could
        # inject workflow commands).
        run: |
          set -euo pipefail
          project="${TEST_PROJECT%/}"
          [[ "$project" =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]*$ ]] || { echo "::error::test-project must be a relative directory of letters, digits, '.', '_', '-' and '/'"; exit 1; }
          [[ "/$project/" != */../* && "/$project/" != */./* && "$project" != *//* ]] || { echo "::error::test-project must not contain '.', '..' or empty path segments"; exit 1; }
          assembly="${TEST_ASSEMBLY:-${project##*/}}"
          [[ "$assembly" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]] || { echo "::error::test-assembly must be letters, digits, '.', '_' and '-'"; exit 1; }
          {
            echo "project=$project"
            echo "assembly=$assembly"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}   # empty = use global.json

      # global.json's `test.runner` is what `dotnet test` itself reads on the
      # .NET 10 SDK; see https://aka.ms/dotnet-test.
      - name: Detect test runner
        id: runner
        run: |
          set -euo pipefail
          runner=VSTest
          if [[ -f global.json ]]; then
            runner="$(jq -r '.test.runner // "VSTest"' global.json)" || { echo "::error::global.json is not valid JSON"; exit 1; }
          fi
          case "$runner" in
            VSTest) mode=vstest ;;
            Microsoft.Testing.Platform) mode=mtp ;;
            *) echo "::error::global.json test.runner must be VSTest or Microsoft.Testing.Platform"; exit 1 ;;
          esac
          echo "Test runner: $runner"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Keyed on the files that decide what gets restored: Directory.Packages.props holds every
      # version, and a project file changing is what adds or drops a reference.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Under Microsoft.Testing.Platform the test project is built as a
      # Microsoft.Testing.Platform app, so `dotnet run` below runs it as one
      # (xunit.v3 otherwise builds its own console runner into the executable).
      - name: Build
        env:
          MODE: ${{ steps.runner.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--no-restore)
          if [[ "$MODE" == mtp ]]; then args+=(-p:UseMicrosoftTestingPlatformRunner=true); fi
          dotnet build "${args[@]}"

      # Testcontainers starts and disposes the PostgreSQL container itself, so this job
      # intentionally has no `services: postgres:` block.
      #
      # VSTest: xUnit.DiagnosticMessages surfaces the provider banner the harness prints; without it
      # the VSTest bridge discards the test host's stdout. It has to be passed here rather than set as
      # `diagnosticMessages` in xunit.runner.json: with the setting in that file, the run hangs after
      # the last test (SDK 10.0.103, VSTest 18.0.1, xunit.v3 3.2.2).
      #
      # Microsoft.Testing.Platform: `dotnet run` rather than `dotnet test`, because `dotnet test`
      # does not forward the test app's console or xUnit diagnostic messages to the log (SDK
      # 10.0.401, xunit.v3 4.0.1), so the banner would never appear. Exit codes are the same:
      # non-zero on any failure, and on a run that finds no tests.
      #
      # `tee` keeps the log for the assertion in the next step.
      - name: Test
        env:
          MODE: ${{ steps.runner.outputs.mode }}
          PROJECT: ${{ steps.validate.outputs.project }}
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/$PROJECT/TestResults"
          if [[ "$MODE" == mtp ]]; then
            dotnet run --project "$PROJECT" --no-build -- \
              --progress off --ansi off --results-directory "$results" \
              --report-xunit-trx --report-xunit-trx-filename test-results.trx \
              --xunit-diagnostics on | tee "$RUNNER_TEMP/test.log"
          else
            dotnet test "$PROJECT" --no-build --results-directory "$results" \
              --logger "trx;LogFileName=test-results.trx" \
              -- xUnit.DiagnosticMessages=true | tee "$RUNNER_TEMP/test.log"
          fi

      # This independently checks the provider the suite reported, so a future harness change cannot
      # silently stop exercising PostgreSQL.
      - name: Confirm the suite ran against PostgreSQL
        if: inputs.expect-postgres
        env:
          ASSEMBLY: ${{ steps.validate.outputs.assembly }}
        run: |
          grep -F "[$ASSEMBLY] database provider: PostgreSQL" "$RUNNER_TEMP/test.log"

      # Unconditional, so that a failing run still publishes which tests failed rather than only the
      # summary line in the log. Coverage is deliberately not collected: nothing gates on the figure.
      - name: Upload test results
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ steps.validate.outputs.project }}/TestResults/test-results.trx
          if-no-files-found: error
