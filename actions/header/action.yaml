name: Header Check

description: "Ensures that all files have a license header. Paths matched by a .headerignore file in the repo root are exempted."

inputs:
  github_token:
    description: "Token for pushing header changes to the calling repository"
    required: true
  use_block_comments:
    description: "Use block comments in header if true. Defaults to false"
    default: false

# Uses a composite action rather than a workflow
# because a composite action can reference the local python script
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.head_ref }}
        token: ${{ inputs.github_token }}

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
        architecture: "x64"

    - name: Check for and Add Headers
      run: python "$GITHUB_ACTION_PATH/header.py" "$USE_BLOCK_COMMENTS"
      env:
        USE_BLOCK_COMMENTS: ${{ inputs.use_block_comments }}
      shell: bash

    - name: Git Diff
      id: git_diff
      run: |
        FILESCHANGED=$(git diff --quiet || echo "TRUE")
        echo "FILESCHANGED=$FILESCHANGED" >> $GITHUB_ENV
      shell: bash

    - name: Commit and push files
      if: env.FILESCHANGED == 'TRUE'
      run: |
        echo "Files have been changed"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "Add missing document markings" -a
      shell: bash

    - name: Push changes
      if: env.FILESCHANGED == 'TRUE'
      run: git push origin "HEAD:refs/heads/$HEAD_REF"
      env:
        HEAD_REF: ${{ github.head_ref }}
      shell: bash
